name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.22.0'

jobs:
  # Backend tests
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
      - name: Build
        run: npm run build

  # Frontend tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm run test -- --run
      
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: /api
          VITE_APP_URL: https://nova-flix.com.ng
          VITE_PERSONA_TEMPLATE_ID: ${{ secrets.PERSONA_TEMPLATE_ID }}
          VITE_PERSONA_ENV_ID: ${{ secrets.PERSONA_ENV_ID }}

  # Flutter tests
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Run analyzer
        run: flutter analyze
      
      - name: Run tests
        run: flutter test
      
      - name: Build APK
        run: flutter build apk --release
        env:
          VITE_API_BASE: https://api.nova-flix.com.ng/api
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novaflix-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # E2E tests
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install frontend dependencies
        run: cd client && npm ci
      
      - name: Build frontend
        run: cd client && npm run build
        env:
          VITE_API_BASE: /api
          VITE_APP_URL: http://localhost:3000
      
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install backend dependencies
        run: cd server && npm ci
      
      - name: Start services
        run: |
          cd server && npm run dev &
          cd ../client && npm run preview -- --port 4173 &
          sleep 10
      
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:4173
          API_BASE: http://localhost:3030/api

  # Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend, flutter, e2e]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Render (Backend)
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
      
      - name: Deploy to Vercel (Frontend)
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --prod=false
      
      - name: Upload Flutter to Play Store (Internal)
        run: |
          echo "Flutter app upload would happen here"

  # Deploy to production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [backend, frontend, flutter, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Render (Backend)
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
      
      - name: Deploy to Vercel (Frontend)
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --prod
      
      - name: Upload Flutter to Play Store (Production)
        run: |
          echo "Flutter app upload to Play Store would happen here"

  # Security audit
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit
        run: |
          cd server && npm audit --audit-level=high
          cd ../client && npm audit --audit-level=high
      
      - name: Run Snyk
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}