# Codemagic configuration for NovaFlix Flutter app.
# Builds a debug APK that can be sideloaded. See https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
workflows:
  android-debug-apk:
    name: NovaFlix Android (Debug APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
    publishing:
      email:
        recipients:
          - successchukwu@gmail.com
