# Codemagic configuration for NovaFlix Flutter app.
# Builds a debug APK that can be sideloaded. See https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
workflows:
  android-debug-apk:
    name: NovaFlix Android (Debug APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK against production backend
        script: |
          flutter build apk --release --dart-define=BASE_URL=https://novaflix-ecz9.onrender.com/api
          # The Flutter Gradle plugin always names the output app-release.apk,
          # so copy it to novaflix.apk for a stable artifact name.
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/novaflix.apk
    artifacts:
      - build/app/outputs/flutter-apk/novaflix.apk
    publishing:
      email:
        recipients:
          - successchukwu@gmail.com
