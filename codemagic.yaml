# Codemagic configuration for NovaFlix Flutter app.
# Builds a release APK (debug-signed for sideloading) against the production
# Render backend. See https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
workflows:
  android-release-apk:
    name: NovaFlix Android (Release APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/wrapper/dists
        - $HOME/.gradle/caches
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build release APK against production backend
        script: |
          flutter build apk --release --dart-define=BASE_URL=https://novaflix-ecz9.onrender.com/api
          # The Flutter Gradle plugin always names the output app-release.apk,
          # so copy it to novaflix.apk for a stable artifact name.
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/novaflix.apk
    artifacts:
      - build/app/outputs/flutter-apk/novaflix.apk
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - successchukwu@gmail.com
